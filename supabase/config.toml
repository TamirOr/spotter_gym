# Local Supabase config. Hosted projects are configured in the dashboard; see docs/setup.md.
project_id = "spotter_gym"

[api]
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081"]
# Sessions persist, so friends rarely sign in again.
jwt_expiry = 3600
enable_refresh_token_rotation = true

# Sign-in and sign-up send a 6-digit code, not a link: a link opens in Safari and would not sign in
# the app installed on the Home Screen.
[auth.email]
enabled = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "קוד הכניסה שלך ל-Spotter"
content_path = "./supabase/templates/otp.html"

[auth.email.template.confirmation]
subject = "קוד הכניסה שלך ל-Spotter"
content_path = "./supabase/templates/otp.html"

# Called by pg_cron with a shared secret, not a user JWT.
[functions.push-dispatch]
verify_jwt = false
