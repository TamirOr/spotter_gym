name: Keep alive and back up

# Free Supabase projects pause after a week without activity and have no automatic backups.
# Every 3 days this touches the API and stores a database dump in a private repository.
# Deploy also runs it before applying migrations.
on:
  schedule:
    - cron: '17 4 */3 * *'
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_DB_URL:
        required: true
      BACKUP_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/supabase-public-config
        with:
          project-ref: rzfcjlzesuwrbaejfgyo
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Touch the API
        run: |
          curl --fail --silent --show-error --output /dev/null \
            "$EXPO_PUBLIC_SUPABASE_URL/rest/v1/activities?select=id&limit=1" \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir backup
          supabase db dump --db-url "$SUPABASE_DB_URL" --file backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy --file backup/data.sql

      - name: Commit to the private backup repository
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          BACKUP_REPOSITORY: ${{ vars.BACKUP_REPOSITORY }}
        run: |
          git clone --depth 1 "https://x-access-token:${BACKUP_TOKEN}@github.com/${BACKUP_REPOSITORY}.git" store
          cp backup/*.sql store/
          cd store
          git config user.name "spotter-backup"
          git config user.email "spotter-backup@users.noreply.github.com"
          git add -A
          # Only counts reach the log; the dump itself never does.
          git commit --quiet -m "Backup $(date -u +%F)" && git push --quiet || echo "No changes since the last backup"
