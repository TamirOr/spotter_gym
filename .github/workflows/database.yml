name: Database

# Applies new migrations to the Supabase project and configures email-code sign-in. Run it by hand
# from the Actions tab, or as the first step of Deploy. Needs the repository secrets
# SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD; the SMTP_* secrets are optional (see docs/setup.md).
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_DB_PASSWORD:
        required: true
      SMTP_HOST:
        required: false
      SMTP_PORT:
        required: false
      SMTP_USER:
        required: false
      SMTP_PASS:
        required: false
      SMTP_SENDER:
        required: false

permissions:
  contents: read

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # The project ref is an identifier, not a secret.
      SUPABASE_PROJECT_REF: rzfcjlzesuwrbaejfgyo
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      # Starting this workflow is the confirmation; CI has no terminal to ask in.
      - run: supabase db push --remote --yes
      - name: List applied migrations
        run: supabase migration list --remote
      - name: Configure email-code sign-in
        run: node scripts/configure-auth.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
