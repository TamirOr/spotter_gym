name: Database

# Applies new migrations to the Supabase project. Run it by hand from the Actions tab, or as the first
# step of Deploy. Needs the repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_DB_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # The project ref is an identifier, not a secret.
      SUPABASE_PROJECT_REF: rzfcjlzesuwrbaejfgyo
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push
      - name: List applied migrations
        run: supabase migration list
