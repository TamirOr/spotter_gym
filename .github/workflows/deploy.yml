name: Deploy

# main is production: database first, so the new web build never meets an old schema.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  database:
    uses: ./.github/workflows/database.yml
    secrets: inherit

  functions:
    needs: database
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy push-dispatch --no-verify-jwt --remote=rzfcjlzesuwrbaejfgyo --yes

  web:
    needs: functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: rzfcjlzesuwrbaejfgyo
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens)"
            exit 1
          fi
      # The app's Supabase address and public key come from the project, so they need no GitHub variables.
      - uses: ./.github/actions/supabase-public-config
        with:
          project-ref: ${{ env.SUPABASE_PROJECT_REF }}
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: npm ci
      - run: npm run build
        env:
          EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_VAPID_PUBLIC_KEY }}
      # Links the build to the Expo project named by app.json's slug, creating it on the first run.
      - name: Link the Expo project
        run: npx eas-cli@latest init --force --non-interactive
      - name: Publish to Expo Hosting
        run: npx eas-cli@latest deploy --prod --non-interactive
