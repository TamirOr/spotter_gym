# Deploys everything from GitHub:
#
#   Merge to main -> tests -> waits for your approval -> backup -> database
#                    -> Edge Function -> web app -> check the site 2 minutes later
#   Run workflow  -> the same, with an option to skip the backup
#
# The "approve" job carries the production GitHub environment, which requires your approval
# (Settings → Environments → production → Required reviewers). To approve: open the run under
# Actions and press "Review deployments".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_backup:
        description: 'Skip the backup before migrations (emergencies)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The project ref is an identifier, not a secret.
  SUPABASE_PROJECT_REF: rzfcjlzesuwrbaejfgyo

jobs:
  # The whole CI suite on the commit being deployed. Nothing deploys unless it passes.
  test:
    uses: ./.github/workflows/ci.yml

  approve:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    # A newer run replaces one still waiting for approval, so approving always deploys the latest main.
    concurrency:
      group: approve-production
      cancel-in-progress: true
    steps:
      - run: echo "Deploying $GITHUB_SHA to production"

  backup:
    needs: approve
    if: ${{ !inputs.skip_backup }}
    uses: ./.github/workflows/keep-alive-backup.yml
    secrets: inherit

  # Runs once approved, when the backup succeeded or was skipped on purpose.
  database:
    needs: [approve, backup]
    if: >-
      always() && needs.approve.result == 'success'
      && (needs.backup.result == 'success' || needs.backup.result == 'skipped')
    uses: ./.github/workflows/database.yml
    secrets: inherit

  functions:
    needs: database
    if: always() && needs.database.result == 'success'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy push-dispatch --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF" --yes

  # Waits for the database and function, so the new web build never meets an old schema.
  web:
    needs: functions
    if: always() && needs.functions.result == 'success'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens)"
            exit 1
          fi
      # The app's Supabase address and public key come from the project, so they need no GitHub variables.
      - uses: ./.github/actions/supabase-public-config
        with:
          project-ref: ${{ env.SUPABASE_PROJECT_REF }}
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: npm ci
      - run: npm run build
        env:
          EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_VAPID_PUBLIC_KEY }}
      # Links the build to the Expo project named by app.json's slug, creating it on the first run.
      - name: Link the Expo project
        run: npx eas-cli@latest init --force --non-interactive
      - name: Publish to Expo Hosting
        run: npx eas-cli@latest deploy --prod --non-interactive

  # The site and the API must still answer once the new build has been live for a while.
  verify:
    needs: web
    if: always() && needs.web.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/supabase-public-config
        with:
          project-ref: ${{ env.SUPABASE_PROJECT_REF }}
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: sleep 120
      - name: Check the API
        run: |
          curl --fail --silent --show-error --output /dev/null \
            "$EXPO_PUBLIC_SUPABASE_URL/rest/v1/activities?select=id&limit=1" \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
      - name: Check the site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::notice title=Site check skipped::Set the repository variable SITE_URL to check the site after each deploy"
            exit 0
          fi
          curl --fail --silent --show-error --location --output /dev/null "$SITE_URL"
